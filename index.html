<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو طلبات مطعم أبو إلياس</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-32">

    <div class="bg-gray-900 text-white text-center py-6 px-4 rounded-b-2xl shadow-md">
        <h1 class="text-xl font-bold">🍔 طلبات مطعم أبو إلياس</h1>
    </div>

    <div id="products-list" class="p-4 grid grid-cols-1 gap-3">
        <p class="text-center py-10">جاري تحميل الأصناف...</p>
    </div>

    <div class="fixed bottom-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-5px_10px_rgba(0,0,0,0.05)]">
        <button onclick="sendOrder()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-md transition-all">
            🚀 إرسال الطلب عبر الواتساب (المجموع: <span id="cart-total">0</span> ل.س)
        </button>
    </div>

    <script>
        // 1. ضع رابط CSV الخاص بك هنا (تأكد أنه ينتهي بـ output=csv)
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQA1N5o-6wYiF-PzhHpuPowJNnAl_TATDAsdnV7weblohCpr8i9xnxbVsvm5EsO-HWo5dG748KuRgil/pub?gid=0&single=true&output=csv";
        
        let products = [];
        let cart = {};

        async function init() {
            try {
                const response = await fetch(SHEET_CSV_URL + "&t=" + new Date().getTime());
                const data = await response.text();
                // تحويل الشيت إلى مصفوفة (مع تجاهل سطر العناوين الأول)
                products = data.split('\n').slice(1).map((row, i) => {
                    const [name, price, cat, desc, img] = row.split(',');
                    return { id: i, name: name?.trim(), price: parseFloat(price) || 0, img: img?.trim() };
                }).filter(p => p.name);
                render();
            } catch (e) {
                document.getElementById('products-list').innerHTML = "<p class='text-center text-red-500'>خطأ في تحميل البيانات!</p>";
            }
        }

        function render() {
            document.getElementById('products-list').innerHTML = products.map(p => `
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                    <img src="${p.img}" class="w-16 h-16 rounded-lg object-cover bg-gray-100">
                    <div class="flex-1 px-3">
                        <h3 class="font-bold text-sm text-gray-800">${p.name}</h3>
                        <p class="text-green-600 font-bold text-xs mt-1">${p.price} ل.س</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-green-500 text-white w-9 h-9 rounded-full font-bold text-lg">+</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            let total = Object.keys(cart).reduce((sum, id) => sum + (products[id].price * cart[id]), 0);
            document.getElementById('cart-total').innerText = total;
        }

        function sendOrder() {
            if(Object.keys(cart).length === 0) { alert("السلة فارغة!"); return; }
            let msg = "طلبي هو: " + Object.keys(cart).map(id => products[id].name + " (x" + cart[id] + ")").join(', ');
            window.open(`https://wa.me/963954573138?text=${encodeURIComponent(msg)}`);
        }

        window.onload = init;
    </script>
</body>
</html>
