<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو مطعم أبو إلياس</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-40">
    <div class="bg-gray-900 text-white text-center py-6 px-4 rounded-b-2xl shadow-md">
        <h1 class="text-xl font-bold">🍔 طلبات مطعم أبو إلياس</h1>
    </div>
    
    <div id="products-list" class="p-4 grid grid-cols-1 gap-3"></div>

    <div class="fixed bottom-0 w-full p-4 bg-white border-t border-gray-200 shadow-[0_-5px_10px_rgba(0,0,0,0.1)]">
        <input type="text" id="client-name" placeholder="👤 اسم الزبون..." class="w-full p-2 mb-2 border rounded-lg text-sm">
        <input type="text" id="client-address" placeholder="📍 العنوان بالتفصيل..." class="w-full p-2 mb-3 border rounded-lg text-sm">
        <button onclick="sendOrder()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow-md">
            🚀 إرسال الطلب (المجموع: <span id="cart-total">0</span> ل.س)
        </button>
    </div>

    <script>
        // المصفوفة الثابتة (يمكنك تعديل الأسماء والأسعار هنا مباشرة)
        const products = [
            { id: 1, name: "اسكالوب", price: 320, image: "https://via.placeholder.com/150" },
            { id: 2, name: "كرانشي", price: 470, image: "https://via.placeholder.com/150" },
            { id: 3, name: "جوي", price: 470, image: "https://via.placeholder.com/150" },
            { id: 4, name: "شبح", price: 470, image: "https://via.placeholder.com/150" },
            { id: 5, name: "برنجي", price: 470, image: "https://via.placeholder.com/150" }
        ];

        let cart = {};
        function render() {
            document.getElementById('products-list').innerHTML = products.map(p => `
                <div class="bg-white p-3 rounded-xl shadow-sm border flex items-center justify-between">
                    <img src="${p.image}" class="w-16 h-16 rounded-lg object-cover">
                    <div class="flex-1 px-3">
                        <h3 class="font-bold text-sm">${p.name}</h3>
                        <p class="text-green-600 text-xs">${p.price} ل.س</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-green-500 text-white w-8 h-8 rounded-full">+</button>
                </div>
            `).join('');
        }
        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            let total = Object.keys(cart).reduce((sum, id) => sum + (products.find(p => p.id == id).price * cart[id]), 0);
            document.getElementById('cart-total').innerText = total;
        }
        function sendOrder() {
            const name = document.getElementById('client-name').value;
            const address = document.getElementById('client-address').value;
            if(!name || !address) { alert("أدخل الاسم والعنوان"); return; }
            let msg = `طلبية جديدة:\nالاسم: ${name}\nالعنوان: ${address}\n\nالطلبات:\n` + Object.keys(cart).map(id => products.find(p => p.id == id).name + " (x" + cart[id] + ")").join('\n');
            window.open(`https://wa.me/963954573138?text=${encodeURIComponent(msg)}`);
        }
        render();
    </script>
</body>
</html>
