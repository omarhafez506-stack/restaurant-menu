<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو طلبات مطعم أبو إلياس</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-32">
    <div class="bg-gray-900 text-white text-center py-6 px-4 rounded-b-2xl shadow-md">
        <h1 class="text-xl font-bold">🍔 طلبات مطعم أبو إلياس</h1>
    </div>
    <div id="products-list" class="p-4 grid grid-cols-1 gap-3"></div>

    <div class="fixed bottom-0 w-full p-4 bg-white border-t">
        <button onclick="sendOrder()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl shadow-md">
            🚀 إرسال الطلب عبر الواتساب (المجموع: <span id="cart-total">0 ل.س</span>)
        </button>
    </div>

    <script>
        const SHEET_CSV_URL = "رابط_ملف_الـ_CSV_الخاص_بشيت_جوجل"; // ضع رابطك هنا
        let products = [], cart = {};

        async function init() {
            const response = await fetch(SHEET_CSV_URL + "&t=" + new Date().getTime());
            const data = await response.text();
            products = data.split('\n').slice(1).map((row, i) => {
                const [name, price, cat, desc, img] = row.split(',');
                return { id: i, name, price, cat, img };
            });
            render();
        }

        function render() {
            document.getElementById('products-list').innerHTML = products.map(p => `
                <div class="bg-white p-3 rounded-xl shadow-sm border flex items-center justify-between">
                    <img src="${p.img}" class="w-16 h-16 rounded-lg object-cover">
                    <div class="flex-1 px-3">
                        <h3 class="font-bold text-sm">${p.name}</h3>
                        <p class="text-green-600 text-xs">${p.price} ل.س</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-green-500 text-white w-8 h-8 rounded-full">+</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            let total = Object.keys(cart).reduce((sum, id) => sum + (products[id].price * cart[id]), 0);
            document.getElementById('cart-total').innerText = total + " ل.س";
        }

        function sendOrder() {
            let msg = "طلبي هو: " + Object.keys(cart).map(id => products[id].name + " (x" + cart[id] + ")").join(', ');
            window.open(`https://wa.me/963954573138?text=${encodeURIComponent(msg)}`);
        }
        window.onload = init;
    </script>
</body>
</html>
